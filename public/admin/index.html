<!-- Sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <span class="brand-logo" aria-label="earthsar"><img src="/assets/earthsar-logo.png" alt="earthsar - Smart Advisors In Real Estate"></span>
    <h1>Admin sign in</h1>
    <div class="fld"><label for="l-email">Email</label><input id="l-email" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="l-pass">Password</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
    <p class="note-err" id="loginErr" role="alert"></p>
    <button class="btn btn-primary" type="submit" id="loginBtn">Sign in</button>
  </form>
</main>
